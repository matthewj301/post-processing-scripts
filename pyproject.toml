[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolpath-processors"
version = "0.1.0"
description = "State-aware G-code processors and cosmetic extrusion-history analysis"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
quality-optimizer = "toolpath_processors.optimizer_cli:main"
cosmetic-entry-conditioning = "toolpath_processors.conditioning_cli:main"
aesthetics-history = "toolpath_processors.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
